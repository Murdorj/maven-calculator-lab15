name: CI Процесс

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    branches:
      - develop
      - release/*

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repo-гээ татаж авна
        uses: actions/checkout@v4

      - name: JDK 17 суулгана
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Checkstyle шалгана
        run: mvn checkstyle:check

      - name: JUnit тест ба Coverage шалгана
        run: mvn test jacoco:check

      - name: Coverage тайлан үүсгэнэ
        run: mvn jacoco:report
